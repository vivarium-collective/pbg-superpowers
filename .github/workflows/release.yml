name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Verify tag matches pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(uv version --short)
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag version ($tag_version) does not match pyproject.toml version ($pyproject_version)"
            exit 1
          fi

      - name: Build distributions (viva-superpowers + pbg-superpowers shim)
        run: |
          uv build --out-dir dist            # the real package: viva-superpowers
          uv build shim --out-dir dist       # deprecated-alias shim: pbg-superpowers
          ls -1 dist

      # Publishes every dist in dist/ — viva-superpowers AND the pbg-superpowers
      # shim. PYPI_API_TOKEN must be account-scoped (or cover both projects);
      # viva-superpowers is a new project on its first release.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
