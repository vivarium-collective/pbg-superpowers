name: pbg-superpowers
version: 0.5.0
description: |
  Process-bigraph project workflow plugin (in development).

  Stable skills: /pbg-expert wraps a simulator into a sibling pbg-* repo
  (or composes multiple); /pbg-wrapper and /pbg-composer are lightweight
  in-workspace counterparts. /pbg-suggest drafts repo names, PR titles,
  and PR bodies in response to dashboard Suggest button requests.

  In-development skills handle workspace scaffolding, the interactive
  dashboard, model development, and visualization codegen.

  v0.4.10 adds a standardized composite spec convention: *.composite.yaml /
  *.composite.json files that declare composite state + parameters, with
  discovery across installed packages and full parameter substitution support.

  v0.4.11 adds a Visualization(Step) base class (pbg_superpowers.visualization)
  so visualization subclasses are auto-discovered via bigraph-schema's discovery
  walker alongside Processes / Emitters / Types.

  v0.4.15 makes Visualization Steps wireable into Composites, not just
  discoverable. Subclasses now override update() (the standard Step contract)
  instead of a separate render() method. inputs() declares consumed observables;
  outputs() exposes an html port; update() accumulates history and re-renders
  the full trajectory each step.

  v0.5.0 establishes the PyPI publishing convention for pbg-* repos: every
  wrapper package SHOULD publish to PyPI. /pbg-expert scaffolds PyPI-ready
  repos (full pyproject.toml with classifiers/URLs/license + release.yml).
  /pbg-package audit gains a "published on PyPI" check. Catalog install
  branches on pypi_name (PyPI path vs git-submodule fallback). uv is now
  enforced in pbg-template workspaces.

  /pbg-explore opens the dashboard's Composite Explorer focused on a single
  composite spec id, starting the dashboard server automatically if needed.

  /pbg-investigate launches or re-runs an Investigation in the dashboard,
  starting the server if needed and opening the Investigations tab in focus mode.
authors:
  - eagmon
skills:
  - pbg-expert
  - pbg-wrapper
  - pbg-composer
  - pbg-suggest
  - pbg-workspace
  - pbg-server
  - pbg-report
  - pbg-investigate
  - pbg-viz
  - pbg-package
  - pbg-explore
