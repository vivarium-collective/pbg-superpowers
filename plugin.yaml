name: pbg-superpowers
version: 0.4.6
description: |
  Process-bigraph project workflow plugin (in development).

  Stable skills: /pbg-expert wraps a simulator into a sibling pbg-* repo
  (or composes multiple); /pbg-wrapper and /pbg-composer are lightweight
  in-workspace counterparts.

  In-development skills handle workspace scaffolding, the interactive
  dashboard, multi-phase model development, and visualization codegen.
authors:
