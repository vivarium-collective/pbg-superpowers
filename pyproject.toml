[project]
name = "pbg-superpowers"
version = "0.16.0"
description = "Plugin Python helpers for the pbg-superpowers skills"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "click>=8.1",
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "pypdf>=4.0",
    # Default framework emitters available in every pbg- workspace. Base install
    # is lightweight (SQLiteEmitter, stdlib); heavy backends stay extras-gated
    # via pbg-emitters[parquet] / [xarray] (see the `evaluator` extra).
    "pbg-emitters",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.1"]
evaluator = ["pbg-emitters[parquet]"]
# Default framework processes (Clock, Intervention, MathExpression).
# Auto-register into the core registry via bigraph-schema package discovery.
# Listed as optional until pbg-basic-processes is published to PyPI; local dev
# installs resolve it via [tool.uv.sources] below.
processes = ["pbg-basic-processes"]
# Agentic-spine event reactor (event_client.py / RFC-0002 Phase A). Used only by
# the optional EventClient; gated as an extra because investigation-contracts is
# a first-party git dependency not published to PyPI. Local dev installs resolve
# it via [tool.uv.sources] below.
events = ["investigation-contracts"]

[tool.uv.sources]
pbg-emitters = { git = "https://github.com/vivarium-collective/pbg-emitters.git", branch = "main" }
pbg-basic-processes = { git = "https://github.com/vivarium-collective/pbg-basic-processes.git", branch = "main" }
investigation-contracts = { git = "https://github.com/vivarium-collective/investigation-contracts.git", branch = "main" }

[project.scripts]
# viva-* are the current CLI names; pbg-* are kept as back-compat aliases
# (identical targets) during the deprecation window (pbg→viva rebrand).
viva-scaffold = "viva_superpowers.scaffold:cli"
viva-feedback-import = "viva_superpowers.feedback_import:cli"
viva-migrate-nested = "viva_superpowers.migrate_nested:main"
viva-migrate-inputs = "viva_superpowers.migrate_inputs:main"
viva-backfill-runs = "viva_superpowers.backfill_runs:main"
viva-compute-outcomes = "viva_superpowers.study_evaluator:compute_outcomes_cli"
viva-sync-runs = "viva_superpowers.study_outcomes:main"
viva-migrate-readouts = "viva_superpowers.readout_migration:main"
viva-populate-simulation-set = "viva_superpowers.simulation_set:main"
viva-populate-findings = "viva_superpowers.finding_observations:main"
viva-roll-up = "viva_superpowers.roll_up:main"
viva-citation-gaps = "viva_superpowers.citation_gaps:main"
viva-canonicalize-studies = "viva_superpowers.study_canonicalize:main"
viva-canonicalize-investigations = "viva_superpowers.investigation_canonicalize:main"
# --- deprecated pbg-* aliases (same targets) ---
pbg-scaffold = "viva_superpowers.scaffold:cli"
pbg-feedback-import = "viva_superpowers.feedback_import:cli"
pbg-migrate-nested = "viva_superpowers.migrate_nested:main"
pbg-migrate-inputs = "viva_superpowers.migrate_inputs:main"
pbg-backfill-runs = "viva_superpowers.backfill_runs:main"
pbg-compute-outcomes = "viva_superpowers.study_evaluator:compute_outcomes_cli"
pbg-sync-runs = "viva_superpowers.study_outcomes:main"
pbg-migrate-readouts = "viva_superpowers.readout_migration:main"
pbg-populate-simulation-set = "viva_superpowers.simulation_set:main"
pbg-populate-findings = "viva_superpowers.finding_observations:main"
pbg-roll-up = "viva_superpowers.roll_up:main"
pbg-citation-gaps = "viva_superpowers.citation_gaps:main"
pbg-canonicalize-studies = "viva_superpowers.study_canonicalize:main"
pbg-canonicalize-investigations = "viva_superpowers.investigation_canonicalize:main"

# Register viva_superpowers' composite-generator discovery into the
# process_bigraph.spec_generators entry-point group. This lets
# process_bigraph.composite_spec.discover_specs find generators via a plugin
# entry point instead of hard-importing viva_superpowers (the old dependency
# inversion). Takes effect on (re)install; once relied upon, the engine's legacy
# import fallback can be removed.
[project.entry-points."process_bigraph.spec_generators"]
viva_superpowers = "viva_superpowers.composite_generator:discover_generators"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `viva_superpowers` is the real package; `pbg_superpowers` is a back-compat shim
# (renamed 2026 — pbg→viva). Both ship so existing `import pbg_superpowers` keeps
# working during the deprecation window. The dist NAME stays `pbg-superpowers`
# until consumers switch their dependency string (they pin it via git @main).
packages = ["viva_superpowers", "pbg_superpowers"]
# templates/ and server/ live outside the package but are required at runtime
# (report renderer, scaffold helper, server scripts). Force-include them in the
# wheel so non-editable installs still work.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "viva_superpowers/_templates"
"server" = "viva_superpowers/_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
