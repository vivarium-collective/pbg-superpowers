[project]
name = "pbg-superpowers"
version = "0.12.0"
description = "Plugin Python helpers for the pbg-superpowers skills"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "click>=8.1",
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.1"]

[project.scripts]
pbg-scaffold = "pbg_superpowers.scaffold:cli"
pbg-feedback-import = "pbg_superpowers.feedback_import:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_superpowers"]
# templates/ and server/ live outside the package but are required at runtime
# (report renderer, scaffold helper, server scripts). Force-include them in the
# wheel so non-editable installs still work.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "pbg_superpowers/_templates"
"server" = "pbg_superpowers/_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
